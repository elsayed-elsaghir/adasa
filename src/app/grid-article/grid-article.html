<div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
  @for (post of postsList.slice(0,6); track post.id) {

  <div>
    <div
      class="group rounded-3xl border border-[#262626] duration-300 hover:border-orange-500/30"
    >
      <a class="rounded-[inherit]" routerLink="/article">
        <div class="relative h-52 overflow-hidden rounded-t-[inherit]">
          <img
            class="h-full w-full rounded-t-[inherit] object-cover duration-500 group-hover:scale-110"
            [src]="post.image"
            [alt]="post.title"
          />
          <div
            class="absolute inset-0 bg-linear-to-t from-black/50 via-transparent to-transparent opacity-0 duration-500 group-hover:opacity-100"
          ></div>
          <span
            class="absolute top-4 right-4 inline-flex items-center gap-1 rounded-full bg-[#0a0a0a]/80 px-3 py-1.5 text-xs font-semibold text-white"
            ><i class="fas fa-star"></i> {{post.category}}
          </span>
        </div>

        <div class="rounded-b-[inherit] bg-[#161616] p-6">
          <div class="mb-3 flex items-center gap-4">
            <div class="inline-flex items-center gap-1 text-sm text-[#737373]">
              <i class="fa-regular fa-clock"></i> {{post.readTime}}
            </div>

            <div class="inline-flex items-center gap-3 text-sm text-[#737373]">
              <span class="h-1 w-1 rounded-full bg-[#737373]"></span> ٨
              {{post.date}}
            </div>
          </div>

          <h4
            class="mb-3 text-2xl leading-6.25 font-bold text-white duration-300 group-hover:text-orange-500 md:text-xl"
          >
            {{post.title}}
          </h4>
          <p class="mb-5 text-sm leading-5.75 text-[#737373]">
            {{post.excerpt}}
          </p>

          <div
            class="flex items-center justify-between border-t border-[#262626] pt-4"
          >
            <div class="flex items-center gap-3">
              <div class="relative inline-block">
                <img
                  class="h-12 w-12 rounded-full object-cover ring-2 ring-[#262626]"
                  [src]="post.author.avatar"
                  [alt]="post.author.name"
                />
                <span
                  class="absolute -bottom-0.75 -left-1 h-4 w-4 rounded-full border-2 border-[#161616] bg-orange-500"
                ></span>
              </div>
              <div>
                <p class="text-sm leading-5 font-semibold text-white">
                  {{post.author.name}}
                </p>
                <p class="text-xs leading-4 text-[#737373]">
                  {{post.author.role}}
                </p>
              </div>
            </div>
            <a
              class="flex h-8 w-8 items-center justify-center gap-2 rounded-full border border-orange-500/20 bg-orange-500/10 text-orange-500 duration-300 group-hover:bg-orange-500 group-hover:text-white"
            >
              <i class="fas fa-chevron-left text-xs"></i>
            </a>
          </div>
        </div>
      </a>
    </div>
  </div>
  }
</div>
