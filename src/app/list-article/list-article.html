@for (post of postsList.slice(0,6); track post.id) {

<div class="mb-8">
  <div
    class="group rounded-3xl border border-[#262626] duration-300 hover:border-orange-500/30"
  >
    <a class="grid rounded-[inherit] md:grid-cols-2" routerLink="/article">
      <div
        class="relative h-52 overflow-hidden rounded-t-[inherit] md:h-auto md:rounded-l-none md:rounded-r-[inherit]"
      >
        <img
          class="h-full w-full rounded-t-[inherit] object-cover duration-500 group-hover:scale-110 md:rounded-r-[inherit]"
          [src]="post.image"
          [alt]="post.title"
        />
        <div
          class="absolute inset-0 bg-linear-to-t from-black/50 via-transparent to-transparent opacity-0 duration-500 group-hover:opacity-100"
        ></div>
        <span
          class="absolute top-4 right-4 inline-flex items-center gap-1 rounded-full bg-linear-to-r from-orange-600 to-yellow-500 px-3 py-1.5 text-xs font-semibold text-white"
          ><i class="fas fa-star"></i>مميز</span
        >
      </div>

      <div
        class="flex flex-col rounded-b-[inherit] bg-[#161616] p-6 md:rounded-l-[inherit] md:rounded-br-none"
      >
        <div class="mb-3 flex items-center gap-2">
          <span
            class="rounded-full border border-[#ff6900] bg-[#ff69001a] px-3 py-1 text-xs font-semibold text-orange-500"
          >
            {{post.category}}
          </span>
          <div class="inline-flex items-center gap-1 text-sm text-[#737373]">
            <i class="fa-regular fa-clock"></i> {{post.date}}
          </div>
        </div>

        <h4
          class="mb-3 text-xl font-bold text-white duration-300 group-hover:text-orange-500"
        >
          {{post.title}}
        </h4>
        <p class="mb-4 leading-7.5 text-[#737373]">{{post.excerpt}}</p>
        <div class="mt-auto flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="relative inline-block">
              <img
                class="h-12 w-12 rounded-full object-cover ring-2 ring-[#262626]"
                [src]="post.author.avatar"
                [alt]="post.author.name"
              />
              <span
                class="absolute -bottom-0.75 -left-1 h-4 w-4 rounded-full border-2 border-[#161616] bg-orange-500"
              ></span>
            </div>
            <div>
              <p class="text-sm leading-5 font-semibold text-white">
                {{post.author.name}}
              </p>
              <p class="text-xs leading-4 text-[#737373]">{{post.date}}</p>
            </div>
          </div>
          <a
            class="inline-flex items-center gap-2 text-sm leading-5 font-semibold text-orange-500"
          >
            <span class="duration-300 group-hover:translate-x-1"
              >اقرأ المقال </span
            ><i class="fas fa-arrow-left"></i>
          </a>
        </div>
      </div>
    </a>
  </div>
</div>
}
