<section class="relative z-10 bg-[#0a0a0a] py-12">
  <div class="mx-auto max-w-7xl">
    <div class="relative z-10 px-4 md:px-6 lg:px-8">
      <div class="mb-8 flex items-center justify-between">
        <p class="flex items-center gap-1 text-neutral-500">
          عرض <span class="font-bold text-white">28</span>مقالات
        </p>
        <div class="rounded-xl border border-[#262626] bg-[#161616] p-1">
          <button
            routerLink="gridArticle"
            routerLinkActive="active-grid-btn"
            class="cursor-pointer rounded-[10px] bg-orange-500 p-2 text-white"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              ></path>
            </svg>
          </button>
          <button
            routerLink="listArticle"
            routerLinkActive="active-grid-btn"
            class="cursor-pointer rounded-[10px] p-2 text-neutral-500"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
        @for (post of postsList; track post.id) { @if(post.category ===
        category){

        <app-card-article [post]="post" />
        } }
      </div>
    </div>
  </div>
</section>
